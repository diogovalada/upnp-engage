name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tag, crate version, and release notes
        run: python3 scripts/release.py validate
  build:
    needs: version
    uses: ./.github/workflows/build.yml
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          pattern: upnp-engage-*
          path: artifacts
      - name: Verify all four artifacts and prepare release files
        run: python3 scripts/release.py assemble
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.txt
          files: release/*
          fail_on_unmatched_files: true
          make_latest: true
